<article class="card h-100 shadow-sm product-card">
  <img
    class="card-img-top product-image"
    [src]="product.thumbnail"
    [alt]="product.title"
    width="300"
    height="300"
    loading="lazy"
  />

  <div class="card-body d-flex flex-column">
    <p class="small mb-2">
      <span class="badge text-bg-dark">{{ product.category }}</span>
    </p>

    <h3 class="h6 card-title product-title" [title]="product.title">{{ product.title }}</h3>

    <p class="fs-5 fw-bold mt-auto mb-3">{{ product.price | currency: 'USD' }}</p>

    <button type="button" class="btn btn-warning fw-semibold w-100" (click)="addToCart.emit(product)">
      Add to cart
    </button>
  </div>
</article>
